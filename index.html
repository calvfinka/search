<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GWM Search — cari konser, festival, gunung, dan blog</title>
<meta name="description" content="Mesin pencari GoWithDME: temukan konser, festival, pendakian, blog, dan komunitas dalam satu kolom.">
<meta name="theme-color" content="#0E5A46">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="search" type="application/opensearchdescription+xml" title="GWM Search" href="opensearch.xml">
<link rel="stylesheet" href="css/search.css">
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="/" aria-label="GWM Search"><span class="mk">G</span><span class="bn">GWM <b>Search</b></span></a>
  <form class="bar bar-sm" id="fSm" role="search" hidden>
    <input id="qSm" type="search" placeholder="Tanyakan apa saja." autocomplete="off" enterkeyhint="search" aria-label="Cari">
    <button aria-label="Cari">↑</button>
  </form>
  <a class="portal" href="https://gowithdme.com">gowithdme.com ↗</a>
</header>

<main id="home" class="home">
  <h1 class="hero"><span>Temukan</span> <span>jawaban</span> yang lebih <span>mendalam.</span></h1>
  <form class="bar" id="fBig" role="search">
    <textarea id="qBig" rows="2" placeholder="Tanyakan apa saja." autocomplete="off" aria-label="Cari" enterkeyhint="search"></textarea>
    <button aria-label="Cari">↑</button>
    <ul class="sug" id="sugBox" role="listbox" hidden></ul>
  </form>
  <ul class="ideas" id="ideas"></ul>
</main>

<main id="res" class="res" hidden>
  <nav class="tabs" id="tabs" aria-label="Kategori hasil"></nav>
  <section class="answer" id="ans" hidden></section>
  <p class="count" id="cnt"></p>
  <ol class="list" id="list"></ol>
  <button class="more" id="more" hidden>Tampilkan lebih banyak</button>
</main>

<footer class="foot">Hasil dari data GoWithDME dan bisa tidak akurat. <a href="https://gowithdme.com/id/privacy">Kebijakan Privasi</a> · <a href="https://gowithdme.com/id/bantuan">Bantuan</a></footer>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/answer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
