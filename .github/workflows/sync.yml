# Tiap 6 jam salin data dari gowithdme.com sebagai cadangan lokal.
name: Sinkron data
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync.py
      - run: |
          git config user.name "gwm-search-bot"; git config user.email "gwm-search-bot@users.noreply.github.com"
          git add data; git diff --cached --quiet || (git commit -m "sync data" && git push)
